<html>
	<head>
		<title>114年1-10月就業服務人數</title>
		<!--ajax引入-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<style>
			body {
			background-color: #8CBDB9;
			color: white;
			font-family: Arial, "Microsoft JhengHei", sans-serif;
			margin: 0;
			padding: 20px;
			}
			
			h1 {
            text-align: center;
            margin-bottom: 20px;
			}
			
			table {
            width: 100%;
            border-collapse: collapse;
            min-width: 2000px; /* 設定最小寬度,確保會出現橫向捲軸 */
			}
			
			thead {
            position: sticky;
            top: 0;
            z-index: 10;
			}
			
			thead td {
            background-color: #2D3E4E !important;
            color: white;
            font-weight: bold;
			font-size: 20px;
            padding: 18px 8px;
            text-align: center;
            border: 1px solid #1a252f;
			}
			
			tbody td {
            padding: 18px 8px;
            border: 1px solid #ddd;
            font-size: 20px;
            vertical-align: top;
            word-wrap: break-word; /* 確保長文字會自動斷行 */
            background-color: white;
            color: #333;
			}
			
			/* 單數行 */
			tbody tr:nth-child(odd) td {
			background-color: #E3F2FD;
			}
			
			/* 雙數行 */
			tbody tr:nth-child(even) td {
			background-color: white;
			}
			
			td {
			padding: 10px 8px;
			border: 1px solid #ddd;
			font-size: 13px;
			vertical-align: top;
			word-wrap: break-word; /* 文字自動換行 */
			}

			/* 表格容器 - 可橫向捲動 */
			.table_container {
            overflow-x: auto;  /* 橫向捲軸 */
            overflow-y: auto;  /* 縱向捲軸 */
            max-height: none;  /* 最大高度為視窗的 最大 */
            margin: 20px auto;
            max-width: 95%;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			}
			
			.back-btn {
            background-color:#2D3E4E;
            color:white;
            border:none;
            padding:8px 16px;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
			}
			
			.back-btn:hover {
			background-color: #8CA9D3;
			box-shadow: 0 0 10px rgba(0,0,0,0.3);
			}
			
		</style>
	</head>

<body>
<div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
	<h1 style="margin:0;">114年1-10月就業服務人數：</h1>
    <button class="back-btn" onclick="goHome()">
        返回首頁
    </button>
</div>

<div class="table_container" id="tableContainer" style="display:none;">
	<table border="1">
		<thead>
		
		<tr bgcolor="#2D3E4E">
			<td align="center">編號</td>
			<td align="center">年度</td>
			<td align="center">月份</td>
			<td align="center">新登記求職人數</td>
			<td align="center">新登記求才人數</td>
			<td align="center">求供倍數</td>
			<td align="center">更新日期</td>
		</tr>
		
		</thead>
		<!--寫死tbody架構 在JQ那邊寫好資料塞進來-->
		<tbody id="row"></tbody>
		
	</table>
</div>

</body>

</html>

<script>
function goHome() {
    window.location.href = "index.html"; 
}
//jquery=JQ使用方法 $(document).ready(function(){}) JQ是他人寫好的JS套件
$(document).ready(function(){
	//ajax屬於JQ的一部分
	$.ajax({
		url:"https://apiservice.mol.gov.tw/OdService/download/A17000000J-030191-BVt", //放網址
		type:"get", //這裡用get請求 亦可用post
		dataType:"json", //檔案類型
		success:function(count){
			//放入原本已有的資料
			total_len=count.length;
			console.log(total_len);
			console.log(count[0]);
			//顯示表格
			$("#tableContainer").show();

			for(i=0;i<total_len;i++){
				$("#row").append( //.html後面的都會被取代 要用增加的.append
					"<tr>"+
						"<td align='center'>"+(i+1)+"</td>"+
						"<td align='center'>"+count[i].年度+"</td>"+
						"<td align='center'>"+count[i].月份+"</td>"+
						"<td align='center'>"+count[i].新登記求職人數+"</td>"+
						"<td align='center'>"+count[i].新登記求才人數+"</td>"+
						"<td align='center'>"+count[i].求供倍數+"</td>"+
						"<td align='center'>"+count[i].更新日期+"</td>"+
					"</tr>"
				);
			} //請求成功要執行的事情
		},
		
		error:function(e){
			console.log("請求失敗!"+e);
		} //請求失敗要執行的事情 最後一個屬性不加逗號
	});
});

</script>
