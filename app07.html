<html>
	<head>
		<title>108-112年私立就業服務機構基本資料及評鑑結果</title>
		<!--ajax引入-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
		<style>
			body {
			background-color: #8CBDB9;
			color: white;
			font-family: Arial, "Microsoft JhengHei", sans-serif;
			margin: 0;
			padding: 20px;
			}
			
			h1 {
            text-align: center;
            margin-bottom: 20px;
			}
			
			table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1500px; /* 設定最小寬度,確保會出現橫向捲軸 */
			}
			
			thead {
            position: sticky;
            top: 0;
            z-index: 10;
			}
			
			thead td {
            background-color: #2D3E4E !important;
            color: white;
            font-weight: bold;
			font-size: 16px;
            padding: 18px 8px;
            text-align: center;
            border: 1px solid #1a252f;
			cursor: pointer;
			user-select: none;
			position: relative;
			}
			
			thead td:hover{
			background-color: #3d4e5e !important;
			}
			
			thead td::after{
			content: "▲▼";
			font-size: 12px;
			opacity: 0.5;
			}

			thead td.sort-desc::after{
			content: "▼";
			opacity: 1;
			}

			thead td.sort-asc::after{
			content: "▲";
			opacity: 1;
			}
			
			tbody td {
            padding: 18px 8px;
            border: 1px solid #ddd;
            font-size: 15px;
            vertical-align: top;
            word-wrap: break-word; /* 確保長文字會自動斷行 */
            background-color: white;
            color: #333;
			}
			
			/* 單數行 */
			tbody tr:nth-child(odd) td {
			background-color: #E3F2FD;
			}
			
			/* 雙數行 */
			tbody tr:nth-child(even) td {
			background-color: white;
			}
			
			td {
			padding: 10px 8px;
			border: 1px solid #ddd;
			font-size: 13px;
			vertical-align: top;
			word-wrap: break-word; /* 文字自動換行 */
			}

			/* 表格容器 - 可橫向捲動 */
			.table_container {
            overflow-x: auto;  /* 橫向捲軸 */
            overflow-y: auto;  /* 縱向捲軸 */
            max-height: 90vh;  /* 最大高度為視窗的 90% */
            margin: 20px auto;
            max-width: 95%;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			}
			
			.back-btn {
            background-color:#2D3E4E;
            color:white;
            border:none;
            padding:8px 16px;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
			}
			
			.back-btn:hover {
			background-color: #8CA9D3;
			box-shadow: 0 0 10px rgba(0,0,0,0.3);
			}
			
		</style>
	</head>

<body>
<div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
	<h1 style="margin:0;">108-112年私立就業服務機構基本資料及評鑑結果：</h1>
    <button class="back-btn" onclick="goHome()">
        返回首頁
    </button>
</div>

<div class="table_container" id="tableContainer" style="display:none;">
	<table border="1">
		<thead>
		
		<tr bgcolor="#2D3E4E">
			<td align="center" data-column="0" data-type="number">編號</td>
			<td align="center" data-column="1" data-type="number">年度</td>
			<td align="center" data-column="2" data-type="number">許可<br>證號</td>
			<td align="center" data-column="3" data-type="text">公司名稱</td>
			<td align="center" data-column="4" data-type="text">區域</td>
			<td align="center" data-column="5" data-type="text">地址</td>
			<td align="center" data-column="6" data-type="number">品質管理<br>（統計數值）</td>
			<td align="center" data-column="7" data-type="number">違規處分<br>（統計數值）</td>
			<td align="center" data-column="8" data-type="number">顧客服務<br>（統計數值）</td>
			<td align="center" data-column="9" data-type="number">其他事項<br>（統計數值）</td>
			<td align="center" data-column="10" data-type="number">總成績<br>（統計數值）</td>
			<td align="center" data-column="11" data-type="text">停業處分及<br>申報暫停營業</td>
			<td align="center" data-column="12" data-type="text">重大違法行為</td>
		</tr>
		
		</thead>
		<!--寫死tbody架構 在JQ那邊寫好資料塞進來-->
		<tbody id="row"></tbody>
		
	</table>
</div>

</body>

</html>

<script>
let originalData=[];
let currentData=[];
let sortStates={};

function goHome() {
    window.location.href = "index.html"; 
}

function renderTable(data){
	$("#row").empty();
	for(let i=0; i<data.length; i++){
		// 處理停業處分及申報暫停營業-Y粗體紅字
		var stopBusiness=data[i]["停業處分及申報暫停營業"];
		var stopBusinessDisplay=(stopBusiness==="Y"||stopBusiness==="y")
			? "<strong style='color:red;'>"+stopBusiness+"</strong>"
			: stopBusiness;
		
		// 處理重大違法行為-Y粗體紅字
		var violation=data[i]["重大違法行為"];
		var violationDisplay=(violation==="Y"||violation==="y") 
			? "<strong style='color:red;'>"+violation+"</strong>" 
			: violation;
		
		// 處理總成績-大於90分加底線
		var totalScore=data[i]["總成績（統計數值）"];
		var totalScoreDisplay=(totalScore>90) 
			? "<span style='text-decoration:underline;'>"+totalScore+"</span>" 
			: totalScore;

		$("#row").append(
			"<tr>"+
				"<td align='center'>"+(i+1)+"</td>"+
				"<td align='center'>"+data[i]["年度"]+"</td>"+
				"<td align='right'>"+data[i]["許可證號"]+"</td>"+
				"<td>"+data[i]["公司名稱"]+"</td>"+
				"<td>"+data[i]["區域"]+"</td>"+
				"<td>"+data[i]["地址"]+"</td>"+
				"<td align='right'>"+data[i]["品質管理（統計數值）"]+"</td>"+
				"<td align='right'>"+data[i]["違規處分（統計數值）"]+"</td>"+
				"<td align='right'>"+data[i]["顧客服務（統計數值）"]+"</td>"+
				"<td align='right'>"+data[i]["其他事項（統計數值）"]+"</td>"+
				"<td align='right'>"+totalScoreDisplay+"</td>"+
				"<td>"+stopBusinessDisplay+"</td>"+
				"<td>"+violationDisplay+"</td>"+
			"</tr>"
		);
	}
}

function sortTable(column, type){
	const fields=[null, "年度", "許可證號", "公司名稱", "區域", "地址", "品質管理（統計數值）", "違規處分（統計數值）",
	 "顧客服務（統計數值）", "其他事項（統計數值）", "總成績（統計數值）", "停業處分及申報暫停營業", "重大違法行為"];

	const fieldName=fields[column];
	if(!fieldName) return;

	if(!sortStates[column]){
		sortStates[column]="none";
	}

	//清除所有排序標記
	for(let key in sortStates){
		if(key != column){
			sortStates[key]="none";
		}
	}

	$("thead td").removeClass("sort-asc sort-desc");

	if(sortStates[column]==="none"){
		//升序
		sortStates[column]="asc";
		$("thead td[data-column='"+column+"']").addClass("sort-asc");

		currentData=[...originalData].sort((a,b)=>{
			let valA=a[fieldName];
			let valB=b[fieldName];

			if(type==="number"){
				return (parseFloat(valA) || 0)-(parseFloat(valB) || 0);
			}else if(type==="date"){
				return (valA || "").localeCompare(valB || "");
			}else{
				return (valA || "").toString().localeCompare((valB || "").toString());
			}
		});
	}else if(sortStates[column]==="asc"){
		//降序
		sortStates[column]="desc";
		$("thead td[data-column='"+column+"']").addClass("sort-desc");

		currentData=[...originalData].sort((a,b)=>{
			let valA=a[fieldName];
			let valB=b[fieldName];

			if(type==="number"){
				return (parseFloat(valB) || 0)-(parseFloat(valA) || 0);
			}else if(type==="date"){
				return (valB || "").localeCompare(valA || "");
			}else{
				return (valB || "").toString().localeCompare((valA || "").toString());
			}
		});
	}else{
		//回到原始順序
		sortStates[column]="none";
		currentData=[...originalData];
	}
	renderTable(currentData);
}

//jquery=JQ使用方法 $(document).ready(function(){}) JQ是他人寫好的JS套件
$(document).ready(function(){
	//ajax屬於JQ的一部分
	$.ajax({
		url:"https://apiservice.mol.gov.tw/OdService/download/A17020000J-000001-MqS", //放網址
		type:"get", //這裡用get請求 亦可用post
		dataType:"json", //檔案類型
		success:function(evaluation){
			originalData=[...evaluation];
			currentData=[...evaluation];

			console.log("共載入"+evaluation.length+"筆職缺資料");
			console.log(evaluation[0]);

			//顯示表格
			$("#tableContainer").show();

			renderTable(currentData);

			$("thead td").click(function(){
				const column=parseInt($(this).attr("data-column"));
				const type=$(this).attr("data-type");
				sortTable(column, type);
			});
		},
		
		error:function(e){
			console.log("請求失敗!"+e);
		} //請求失敗要執行的事情 最後一個屬性不加逗號
	});
});

</script>
