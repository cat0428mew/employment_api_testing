<html>
	<head>
		<title>職業訓練課程資訊</title>
		<!--ajax引入-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
		<!--SheetJS 用於匯出Excel-->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

		<style>
			body {
			background-color: #8CBDB9;
			color: white;
			font-family: Arial, "Microsoft JhengHei", sans-serif;
			margin: 0;
			padding: 20px;
			}
			
			h1 {
            text-align: center;
            margin-bottom: 20px;
			}
			
			table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1500px; /* 設定最小寬度,確保會出現橫向捲軸 */
			table-layout: fixed; /* 這是關鍵!沒有這個寬度設定不會生效 */
			}
			
			thead {
            position: sticky;
            top: 0;
            z-index: 10;
			}
			
			thead td {
            background-color: #2D3E4E !important;
            color: white;
            font-weight: bold;
			font-size: 16px;
            padding: 18px 8px;
            text-align: center;
            border: 1px solid #1a252f;
			cursor: pointer;
			user-select: none;
			position: relative;
			}
			
			thead td:hover{
			background-color: #3d4e5e !important;
			}
			
			thead td::after{
			content: "▲▼";
			font-size: 12px;
			opacity: 0.5;
			}

			thead td.sort-desc::after{
			content: "▼";
			opacity: 1;
			}

			thead td.sort-asc::after{
			content: "▲";
			opacity: 1;
			}

			tbody td {
            padding: 18px 8px;
            border: 1px solid #ddd;
            font-size: 15px;
            vertical-align: top;
            word-wrap: break-word; /* 確保長文字會自動斷行 */
            background-color: white;
            color: #333;
			}

			.text-content {
			display: block; /*不能用inlline -webkit-line-clamp不支援display: inline*/
			}

			.text-content.collapsed {
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
			text-overflow: ellipsis;
			}

			.more-btn {
			color: #2196F3;
			cursor: pointer;
			font-weight: bold;
			text-decoration: underline;
			margin-left: 5px;
			white-space: nowrap;
			display: inline-block; /*換行*/
			}

			.more-btn:hover {
			color: #1976d2;
			}
			
			/* 單數行 */
			tbody tr:nth-child(odd) td {
			background-color: #E3F2FD;
			}
			
			/* 雙數行 */
			tbody tr:nth-child(even) td {
			background-color: white;
			}
			
			td {
			padding: 10px 8px;
			border: 1px solid #ddd;
			font-size: 15px;
			vertical-align: top;
			word-wrap: break-word; /* 文字自動換行 */
			}
			
			/* 針對不同欄位設定寬度 */
			thead td:nth-child(1) { width: 50px; }   /* 編號 */
			thead td:nth-child(2) { width: 80px; }   /* URL連結 */
			thead td:nth-child(3) { width: 200px; }  /* 訓練時間 */
			thead td:nth-child(4) { width: 200px; }  /* 報名時間 */
			thead td:nth-child(5) { width: 150px; }  /* 考試時間 */
			thead td:nth-child(6) { width: 100px; }  /* 負擔費用 */
			thead td:nth-child(7) { width: 250px;  max-width: 300px; line-height: 1.6;}  /* 職訓目標 */
			thead td:nth-child(8) { width: 300px;  max-width: 300px; line-height: 1.6;}  /* 課程內容 */
			thead td:nth-child(9) { width: 120px; }  /* 區域單位名稱 */
			thead td:nth-child(10) { width: 150px; } /* BTI單位名稱 */
			thead td:nth-child(11) { width: 100px; } /* 課程時段 */
			thead td:nth-child(12) { width: 80px; }  /* 數值 */
			thead td:nth-child(13) { width: 100px; } /* 縣市名稱 */
			thead td:nth-child(14) { width: 100px; } /* 地區 */
			thead td:nth-child(15) { width: 80px; }  /* 總數量 */
			thead td:nth-child(16) { width: 80px; }  /* 數量 */
			thead td:nth-child(17) { width: 250px; } /* 職訓處地址 */
			thead td:nth-child(18) { width: 150px; } /* 職訓處名稱 */
			thead td:nth-child(19) { width: 120px; } /* 職訓處電話 */
			thead td:nth-child(20) { width: 80px; }  /* 分機 */
			thead td:nth-child(21) { width: 180px; } /* EMAIL */
			thead td:nth-child(22) { width: 80px; }  /* 序號 */
			thead td:nth-child(23) { width: 200px; } /* 職訓課程名稱 */
			thead td:nth-child(24) { width: 80px; }  /* 數量 */
			thead td:nth-child(25) { width: 150px; } /* HashCode */

			/* 表格容器 - 可橫向捲動 */
			.table_container {
            overflow-x: auto;  /* 橫向捲軸 */
            overflow-y: auto;  /* 縱向捲軸 */
            max-height: 90vh;  /* 最大高度為視窗的 90% */
            margin: 20px auto;
            max-width: 95%;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			}
			
			.back-btn {
            background-color:#2D3E4E;
            color:white;
            border:none;
            padding:8px 16px;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
			}
			
			.back-btn:hover {
			background-color: #8CA9D3;
			box-shadow: 0 0 10px rgba(0,0,0,0.3);
			}
			
			/* 下載表格儲存區 */
			/* 下載按鈕區塊 */
			.download-section {
			text-align: center;
			margin-bottom: 20px;
			}

			.download-btn {
			background-color: #2D3E4E;
			color: white;
			border: none;
			padding: 10px 20px;
			font-size: 16px;
			border-radius: 6px;
			cursor: pointer;
			margin: 0 10px;
			transition: 0.3s;
			}

			.download-btn:hover {
			background-color: #4CAF50;
			box-shadow: 0 0 10px rgba(0,0,0,0.3);
			}

			.download-btn.excel:hover {
			background-color: #217346;
			}

			.download-btn.csv:hover {
			background-color: #0066CC;
			}
		</style>
	</head>

<body>
<div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
	<h1 style="margin:0;">職業訓練課程資訊：</h1>
    <button class="back-btn" onclick="goHome()">
        返回首頁
    </button>
</div>

<!-- 下載按鈕區 -->
<div class="download-section">
	<button class="download-btn csv" onclick="downloadCSV()">下載儲存CSV</button>
	<button class="download-btn excel" onclick="downloadExcel()">下載儲存Excel</button>
</div>

<div class="table_container" id="tableContainer" style="display:none;">
	<table border="1">
		<thead>
		
		<tr bgcolor="#2D3E4E">
			<td align="center" data-column="0" data-type="number">編號</td>
			<td align="center" data-column="1" data-type="text">職業訓練課程的URL</td>
			<td align="center" data-column="2" data-type="date">訓練時間</td>
			<td align="center" data-column="3" data-type="date">報名時間</td>
			<td align="center" data-column="4" data-type="date">考試時間</td>
			<td align="center" data-column="5" data-type="text">負擔費用</td>
			<td align="center" data-column="6" data-type="text">職訓目標</td>
			<td align="center" data-column="7" data-type="text">課程內容</td>
			<td align="center" data-column="8" data-type="text">區域單位名稱</td>
			<td align="center" data-column="9" data-type="text">BTI單位名稱</td>
			<td align="center" data-column="10" data-type="text">課程時段</td>
			<td align="center" data-column="11" data-type="number">數值</td>
			<td align="center" data-column="12" data-type="text">縣市名稱</td>
			<td align="center" data-column="13" data-type="text">地區</td>
			<td align="center" data-column="14" data-type="number">總數量</td>
			<td align="center" data-column="15" data-type="number">數量</td>
			<td align="center" data-column="16" data-type="text">職訓處地址</td>
			<td align="center" data-column="17" data-type="text">職訓處名稱</td>
			<td align="center" data-column="18" data-type="text">職訓處電話</td>
			<td align="center" data-column="19" data-type="text">分機</td>
			<td align="center" data-column="20" data-type="text">EMAIL</td>
			<td align="center" data-column="21" data-type="text">序號</td>
			<td align="center" data-column="22" data-type="text">職訓課程名稱</td>
			<td align="center" data-column="23" data-type="number">數量</td>
			<td align="center" data-column="24" data-type="text">HashCode</td>
		</tr>
		
		</thead>
		<!--寫死tbody架構 在JQ那邊寫好資料塞進來-->
		<tbody id="row"></tbody>
		
	</table>
</div>

</body>

</html>

<script>
let originalData=[];
let currentData=[];
let sortStates={};

function goHome() {
    window.location.href = "index.html"; 
}

function toggleText(btn){
	const textContent=$(btn).prev(".text-content");

	if(textContent.hasClass("collapsed")){
		textContent.removeClass("collapsed");
		$(btn).text("(less)");
	}else{
		textContent.addClass("collapsed");
		$(btn).text("(more)");
	}
}

function renderTable(data){
	$("#row").empty();
	for(let i=0; i<data.length; i++){
		//處理"職訓目標"欄位
		const purpose=data[i]["PURPOSE"] || "";
		const purposeNeedsCollapse=purpose.length>40;
		const purposeHtml=purposeNeedsCollapse
			? '<span class="text-content collapsed">' + purpose + '</span><span class="more-btn" onclick="toggleText(this)">(more)</span>'
			: '<span class="text-content">' + purpose + '</span>';
		
		//處理"課程內容"欄位
		const content=data[i]["CONTENT"] || "";
		const contentNeedsCollapse=content.length>40;
		const contentHtml=contentNeedsCollapse
			? '<span class="text-content collapsed">' + content + '</span><span class="more-btn" onclick="toggleText(this)">(more)</span>'
			: '<span class="text-content">' + content + '</span>';

		$("#row").append(
			"<tr>"+
				"<td align='center'>"+(i+1)+"</td>"+
				"<td><a href='"+(data[i].URL || "#")+"' target='_blank' style='color:#2196F3;'>連結</a></td>" +
				"<td>"+data[i]["TRAINING_PERIOD"]+"</td>"+
				"<td>"+data[i]["SIGNUP_PERIOD"]+"</td>"+
				"<td>"+data[i]["TEST_DATE"]+"</td>"+
				"<td>"+data[i]["FEE"]+"</td>"+
				"<td>"+purposeHtml+"</td>"+
				"<td>"+contentHtml+"</td>"+
				"<td>"+data[i]["DISTNAME"]+"</td>"+
				"<td>"+data[i]["BTINAME"]+"</td>"+
				"<td align='center'>"+data[i]["HOURRANNAME"]+"</td>"+
				"<td align='center'>"+data[i]["THOURS"]+"</td>"+
				"<td align='center'>"+data[i]["CTNAME"]+"</td>"+
				"<td align='center'>"+data[i]["ZIPNAME"]+"</td>"+
				"<td align='center'>"+data[i]["CAI_ZIPCODE"]+"</td>"+
				"<td align='center'>"+data[i]["CAI_ZIPCODE2W"]+"</td>"+
				"<td>"+data[i]["CAI_ADDRESS"]+"</td>"+
				"<td>"+data[i]["CNAME"]+"</td>"+
				"<td>"+data[i]["PHONE"]+"</td>"+
				"<td>"+data[i]["PHONE_EXT"]+"</td>"+
				"<td>"+data[i]["EMAIL"]+"</td>"+
				"<td>"+data[i]["BCM_SNO"]+"</td>"+
				"<td>"+data[i]["CLASSNAME"]+"</td>"+
				"<td align='center'>"+data[i]["CYCLTYPE"]+"</td>"+
				"<td align='center'>"+data[i]["HashCode"]+"</td>"+
			"</tr>"
		);
	}
}

function sortTable(column, type){
	const fields=[null, "URL", "TRAINING_PERIOD", "SIGNUP_PERIOD", "TEST_DATE", 
                    "FEE", "PURPOSE", "CONTENT", "DISTNAME", "BTINAME",
                    "HOURRANNAME", "THOURS（數值）", "CTNAME（縣市名稱）", "ZIPNAME", "CAI_ZIPCODE（數量）", "CAI_ZIPCODE2W（數量）",
                    "CAI_ADDRESS", "CNAME", "PHONE", "PHONE_EXT", "EMAIL", "BCM_SNO（序號）", "CLASSNAME", "CYCLTYPE（數量）", "HashCode"];
	
	const fieldName=fields[column];
	if(!fieldName) return;
	
	if(!sortStates[column]){
		sortStates[column]="none";
	}

	//清除所有排序標記
	for(let key in sortStates){
		if(key != column){
			sortStates[key]="none";
		}
	}

	$("thead td").removeClass("sort-asc sort-desc");

	if(sortStates[column]==="none"){
		//升序
		sortStates[column]="asc";
		$("thead td[data-column='"+column+"']").addClass("sort-asc");

		currentData=[...originalData].sort((a,b)=>{
			let valA=a[fieldName];
			let valB=b[fieldName];

			if(type==="number"){
				return (parseFloat(valA) || 0)-(parseFloat(valB) || 0);
			}else if(type==="date"){
				return (valA || "").localeCompare(valB || "");
			}else{
				return (valA || "").toString().localeCompare((valB || "").toString());
			}
		});
	}else if(sortStates[column]==="asc"){
		//降序
		sortStates[column]="desc";
		$("thead td[data-column='"+column+"']").addClass("sort-desc");

		currentData=[...originalData].sort((a,b)=>{
			let valA=a[fieldName];
			let valB=b[fieldName];

			if(type==="number"){
				return (parseFloat(valB) || 0)-(parseFloat(valA) || 0);
			}else if(type==="date"){
				return (valB || "").localeCompare(valA || "");
			}else{
				return (valB || "").toString().localeCompare((valA || "").toString());
			}
		});		
	}else{
		//回到原始順序
		sortStates[column]="none";
		currentData=[...originalData];
	}
	renderTable(currentData);
}

//下載CSV
function downloadCSV(){
	if(currentData.length===0){
		alert("沒有資料可下載！");
		return;
	}

	//CSV標題行
	const headers=[
		"編號", "職業訓練課程的URL", "訓練時間", "報名時間", "考試時間",
		"負擔費用", "職訓目標", "課程內容", "區域單位名稱", "BTI單位名稱",
		"課程時段", "數值", "縣市名稱", "地區", "總數量", "數量", "職訓處地址", 
		"職訓處名稱", "職訓處電話", "分機", "EMAIL", "序號", "職訓課程名稱", 
		"數量", "HashCode"
	];

	//組合CSV內容
	let csvContent="\uFEFF"; //UTF-8 BOM 解決中文亂碼
	csvContent+=headers.join(",")+"\n";

	currentData.forEach((row, index)=>{
		const rowData=[
			index+1,
			`"${(row.OCCU_DESC || "").replace(/"/g, '""')}"`,
			`"${(row.WK_TYPE || "").replace(/"/g, '""')}"`,
			row.CJOB1_COUNT || "",
			`"${(row.CJOB_NAME1 || "").replace(/"/g, '""')}"`,
			row.CJOB2_COUNT || "",
			`"${(row.CJOB_NAME2 || "").replace(/"/g, '""')}"`,
			row.JOB_PERSON || "",
			row.STOP_DATE || "",
			`"${(row.JOB_DETAIL || "").replace(/"/g, '""')}"`,
			`"${(row.CITYNAME || "").replace(/"/g, '""')}"`,
			`"${(row.EXPERIENCE || "").replace(/"/g, '""')}"`,
			`"${(row.WKTIME || "").replace(/"/g, '""')}"`,
			`"${(row.SALARYCD || "").replace(/"/g, '""')}"`,
			row.NT_L || "",
			row.NT_U || "",
			`"${(row.EDGRDESC || "").replace(/"/g, '""')}"`,
			row.URL_QUERY || "",
			`"${(row.COMPNAME || "").replace(/"/g, '""')}"`,
			row.TRANDATE || ""
		];
		csvContent+=rowData.join(",")+"\n";
	});

	//創建下載
	const blob=new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
	const link=document.createElement("a");
	const url=URL.createObjectURL(blob);
	
	link.setAttribute("href", url);
	link.setAttribute("download", "職業訓練課程資訊_"+new Date().toLocaleDateString('zh-TW')+".csv");
	link.style.visibility="hidden";
	
	document.body.appendChild(link);
	link.click();
	document.body.removeChild(link);
}

//下載Excel
function downloadExcel(){
	if(currentData.length===0) {
		alert("沒有資料可下載！");
		return;
	}

	//準備Excel資料
	const excelData=currentData.map((row, index) => ({
		"編號": index+1,
		"URL": row.URL || "",
		"TRAINING_PERIOD": row.TRAINING_PERIOD || "",
		"SIGNUP_PERIOD": row.SIGNUP_PERIOD || "",
		"TEST_DATE": row.TEST_DATE || "",
		"FEE": row.FEE || "",
		"PURPOSE": row.PURPOSE || "",
		"CONTENT": row.CONTENT || "",
		"DISTNAME": row.DISTNAME || "",
		"BTINAME": row.BTINAME || "",
		"HOURRANNAME": row.HOURRANNAME || "",
		"THOURS": row["THOURS"] || "",
		"CTNAME": row["CTNAME"] || "",
		"ZIPNAME": row.ZIPNAME || "",
		"CAI_ZIPCODE": row["CAI_ZIPCODE"] || "",
		"CAI_ZIPCODE2W": row["CAI_ZIPCODE2W"] || "",
		"CAI_ADDRESS": row.CAI_ADDRESS || "",
		"CNAME": row.CNAME || "",
		"PHONE": row.PHONE || "",
		"PHONE_EXT": row.PHONE_EXT || "",
		"EMAIL": row.EMAIL || "",
		"BCM_SNO": row["BCM_SNO"] || "",
		"CLASSNAME": row.CLASSNAME || "",
		"CYCLTYPE": row["CYCLTYPE"] || "",
		"HashCode": row.HashCode || ""
	}));

	//創建工作簿
	const ws=XLSX.utils.json_to_sheet(excelData);
	const wb=XLSX.utils.book_new();
	XLSX.utils.book_append_sheet(wb, ws, "職業訓練課程資訊");

	//下載檔案
	XLSX.writeFile(wb, "職業訓練課程資訊_"+new Date().toLocaleDateString('zh-TW')+".xlsx");
}

//jquery=JQ使用方法 $(document).ready(function(){}) JQ是他人寫好的JS套件
$(document).ready(function(){
	//ajax屬於JQ的一部分
	$.ajax({
		url:"https://apiservice.mol.gov.tw/OdService/download/A17000000J-000007-BAB", //放網址
		type:"get", //這裡用get請求 亦可用post
		dataType:"json", //檔案類型
		success:function(training){
			originalData=[...training];
			currentData=[...training];

			console.log("共載入"+training.length+"筆職缺資料");
			console.log(training[0]);
			//顯示表格
			$("#tableContainer").show();

			renderTable(currentData);

			$("thead td").click(function(){
				const column=parseInt($(this).attr("data-column"));
				const type=$(this).attr("data-type");
				sortTable(column, type);
			});
		},
		
		error:function(e){
			console.log("請求失敗!"+e);
		} //請求失敗要執行的事情 最後一個屬性不加逗號
	});
});

</script>
