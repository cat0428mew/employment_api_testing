<html>
	<head>
		<title>勞就保保險費分擔金額表</title>
		<!--ajax引入-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
		<!--SheetJS 用於匯出Excel-->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

		<style>
			body {
			background-color: #8CBDB9;
			color: white;
			font-family: Arial, "Microsoft JhengHei", sans-serif;
			margin: 0;
			padding: 20px;
			}
			
			h1 {
            text-align: center;
            margin-bottom: 20px;
			}
			
			table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1500px; /* 設定最小寬度,確保會出現橫向捲軸 */
			}
			
			thead {
            position: sticky;
            top: 0;
            z-index: 10;
			}
			
			thead td {
            background-color: #2D3E4E !important;
            color: white;
            font-weight: bold;
			font-size: 20px;
            padding: 18px 8px;
            text-align: center;
            border: 1px solid #1a252f;
			cursor: pointer;
			user-select: none;
			position: relative;
			}
			
			thead td:hover{
			background-color: #3d4e5e !important;
			}
			
			thead td::after{
			content: "▲▼";
			font-size: 12px;
			opacity: 0.5;
			}

			thead td.sort-desc::after{
			content: "▼";
			opacity: 1;
			}

			thead td.sort-asc::after{
			content: "▲";
			opacity: 1;
			}
			
			tbody td {
            padding: 18px 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            vertical-align: top;
            word-wrap: break-word; /* 確保長文字會自動斷行 */
            background-color: white;
            color: #333;
			}
			
			/* 單數行 */
			tbody tr:nth-child(odd) td {
			background-color: #E3F2FD;
			}
			
			/* 雙數行 */
			tbody tr:nth-child(even) td {
			background-color: white;
			}
			
			td {
			padding: 10px 8px;
			border: 1px solid #ddd;
			font-size: 16px;
			vertical-align: top;
			word-wrap: break-word; /* 文字自動換行 */
			}

			/* 表格容器 - 可橫向捲動 */
			.table_container {
            overflow-x: auto;  /* 橫向捲軸 */
            overflow-y: auto;  /* 縱向捲軸 */
            max-height: 90vh;  /* 最大高度為視窗的 90% */
            margin: 20px auto;
            max-width: 95%;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			}
			
			.back-btn {
            background-color:#2D3E4E;
            color:white;
            border:none;
            padding:8px 16px;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
			}
			
			.back-btn:hover {
			background-color: #8CA9D3;
			box-shadow: 0 0 10px rgba(0,0,0,0.3);
			}
			
			/* 下載表格儲存區 */
			/* 下載按鈕區塊 */
			.download-section {
			text-align: center;
			margin-bottom: 20px;
			}

			.download-btn {
			background-color: #2D3E4E;
			color: white;
			border: none;
			padding: 10px 20px;
			font-size: 16px;
			border-radius: 6px;
			cursor: pointer;
			margin: 0 10px;
			transition: 0.3s;
			}

			.download-btn:hover {
			background-color: #4CAF50;
			box-shadow: 0 0 10px rgba(0,0,0,0.3);
			}

			.download-btn.excel:hover {
			background-color: #217346;
			}

			.download-btn.csv:hover {
			background-color: #0066CC;
			}
		</style>
	</head>

<body>
<div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
	<h1 style="margin:0;">勞就保保險費分擔金額表：</h1>
    <button class="back-btn" onclick="goHome()">
        返回首頁
    </button>
</div>

<!-- 下載按鈕區 -->
<div class="download-section">
	<button class="download-btn csv" onclick="downloadCSV()">下載儲存CSV</button>
	<button class="download-btn excel" onclick="downloadExcel()">下載儲存Excel</button>
</div>

<div class="table_container" id="tableContainer" style="display:none;">
	<table border="1">
		<thead>
		
		<tr bgcolor="#2D3E4E">
			<td align="center" data-column="0" data-type="number">編號</td>
			<td align="center" data-column="1" data-type="number">序號</td>
			<td align="center" data-column="2" data-type="number">勞保普通費率</td>
			<td align="center" data-column="3" data-type="number">就保費率</td>
			<td align="center" data-column="4" data-type="number">投保薪資</td>
			<td align="center" data-column="5" data-type="number">勞工應負擔保費金額</td>
			<td align="center" data-column="6" data-type="number">單位應負擔保費金額</td>
		</tr>
		
		</thead>
		<!--寫死tbody架構 在JQ那邊寫好資料塞進來-->
		<tbody id="row"></tbody>
		
	</table>
</div>

</body>

</html>

<script>
let originalData=[];
let currentData=[];
let sortStates={};

function goHome() {
    window.location.href = "index.html"; 
}

function renderTable(data){
	$("#row").empty();
	for(let i=0; i<data.length; i++){
		$("#row").append(
			"<tr>"+
				"<td align='center'>"+(i+1)+"</td>"+
				"<td>"+data[i].序號+"</td>"+
				"<td align='center'>"+data[i].勞保普通費率+"</td>"+
				"<td align='center'>"+data[i].就保費率+"</td>"+
				"<td align='right'>"+data[i].投保薪資+"</td>"+
				"<td align='right'>"+data[i].勞工應負擔保費金額+"</td>"+
				"<td align='right'>"+data[i].單位應負擔保費金額+"</td>"+
			"</tr>"
		);
	}
}

function sortTable(column, type){
	const fields=[null, "序號", "勞保普通費率", "就保費率", "投保薪資", "勞工應負擔保費金額", "單位應負擔保費金額"];

	const fieldName=fields[column];
	if(!fieldName) return;

	if(!sortStates[column]){
		sortStates[column]="none";
	}

	//清除所有排序標記
	for(let key in sortStates){
		if(key != column){
			sortStates[key]="none";
		}
	}

	$("thead td").removeClass("sort-asc sort-desc");

	if(sortStates[column]==="none"){
		//升序
		sortStates[column]="asc";
		$("thead td[data-column='"+column+"']").addClass("sort-asc");

		currentData=[...originalData].sort((a,b)=>{
			let valA=a[fieldName];
			let valB=b[fieldName];

			if(type==="number"){
				return (parseFloat(valA) || 0)-(parseFloat(valB) || 0);
			}else if(type==="date"){
				return (valA || "").localeCompare(valB || "");
			}else{
				return (valA || "").toString().localeCompare((valB || "").toString());
			}
		});
	}else if(sortStates[column]==="asc"){
		//降序
		sortStates[column]="desc";
		$("thead td[data-column='"+column+"']").addClass("sort-desc");

		currentData=[...originalData].sort((a,b)=>{
			let valA=a[fieldName];
			let valB=b[fieldName];

			if(type==="number"){
				return (parseFloat(valB) || 0)-(parseFloat(valA) || 0);
			}else if(type==="date"){
				return (valB || "").localeCompare(valA || "");
			}else{
				return (valB || "").toString().localeCompare((valA || "").toString());
			}
		});
	}else{
		//回到原始順序
		sortStates[column]="none";
		currentData=[...originalData];
	}
	renderTable(currentData);
}

//下載CSV
function downloadCSV(){
	if(currentData.length===0){
		alert("沒有資料可下載！");
		return;
	}

	//CSV標題行
	const headers=[
		"編號", "序號", "勞保普通費率", "就保費率", "投保薪資", "勞工應負擔保費金額", "單位應負擔保費金額"
	];

	//組合CSV內容
	let csvContent="\uFEFF"; //UTF-8 BOM 解決中文亂碼
	csvContent+=headers.join(",")+"\n";

	currentData.forEach((row, index)=>{
		const rowData=[
			index+1,
			row["序號"] || "",
			row["勞保普通費率"] || "",
			row["就保費率"] || "",
			row["投保薪資"] || "",
			row["勞工應負擔保費金額"] || "",
			row["單位應負擔保費金額"] || ""
		];
		csvContent+=rowData.join(",")+"\n";
	});

	//創建下載
	const blob=new Blob([csvContent], {type:"text/csv;charset=utf-8;"});
	const link=document.createElement("a");
	const url=URL.createObjectURL(blob);
	
	link.setAttribute("href", url);
	link.setAttribute("download", "勞就保保險費分擔金額表_"+new Date().toLocaleDateString('zh-TW')+".csv");
	link.style.visibility="hidden";
	
	document.body.appendChild(link);
	link.click();
	document.body.removeChild(link);
}

//下載Excel
function downloadExcel(){
	if(currentData.length===0) {
		alert("沒有資料可下載！");
		return;
	}

	//準備Excel資料
	const excelData=currentData.map((row, index) => ({
		"編號": index+1,
		"序號": row.序號 || "",
		"勞保普通費率": row.勞保普通費率 || "",
		"就保費率": row.就保費率 || "",
		"投保薪資": row.投保薪資 || "",
		"勞工應負擔保費金額": row.勞工應負擔保費金額 || "",
		"單位應負擔保費金額": row.單位應負擔保費金額 || ""
	}));

	//創建工作簿
	const ws=XLSX.utils.json_to_sheet(excelData);
	const wb=XLSX.utils.book_new();
	XLSX.utils.book_append_sheet(wb, ws, "勞就保保險費分擔金額表");

	//下載檔案
	XLSX.writeFile(wb, "勞就保保險費分擔金額表_"+new Date().toLocaleDateString('zh-TW')+".xlsx");
}

//jquery=JQ使用方法 $(document).ready(function(){}) JQ是他人寫好的JS套件
$(document).ready(function(){
	//ajax屬於JQ的一部分
	$.ajax({
		url:"https://apiservice.mol.gov.tw/OdService/download/A17000000J-020015-t0a", //放網址
		type:"get", //這裡用get請求 亦可用post
		dataType:"json", //檔案類型
		success:function(contribution){
			originalData=[...contribution];
			currentData=[...contribution];

			console.log("共載入"+contribution.length+"筆職缺資料");
			console.log(contribution[0]);

			//顯示表格
			$("#tableContainer").show();

			renderTable(currentData);

			$("thead td").click(function(){
				const column=parseInt($(this).attr("data-column"));
				const type=$(this).attr("data-type");
				sortTable(column, type);
			});
		},
		
		error:function(e){
			console.log("請求失敗!"+e);
		} //請求失敗要執行的事情 最後一個屬性不加逗號
	});
});

</script>
