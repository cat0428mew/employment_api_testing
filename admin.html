<html>
<head>
	<meta charset="UTF-8">
	<title>諮詢/意見箱管理後台</title>

	<style>
		body{
        background-color: #f5f5f5;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        padding: 20px;
		}
		
		h1{
        color: #2D3E4E;
        text-align: center;
		}
		
		.container{
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
		}
		
		.stats{
        background: #8CBDB9;
        color: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
		}
		
		.stats h2{
        margin: 0;
        font-size: 36px;
		}
		
		.feedback-item{
        border: 1px solid #ddd;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 8px;
        background: #f9f9f9;
		}
		
		.feedback-header{
        background: #2D3E4E;
        color: white;
        padding: 10px 15px;
        border-radius: 5px;
        margin-bottom: 10px;
		}
		
		.feedback-info{
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 10px;
        font-size: 14px;
		}
		
		.feedback-content{
        background: white;
        padding: 15px;
        border-radius: 5px;
        border-left: 4px solid #8CBDB9;
		}
		
		.clear-btn{
        background: #dc3545;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
		}
		
		.clear-btn:hover{
        background: #c82333;
		}
		
		.back-btn{
        background: #2D3E4E;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        margin-right: 10px;
		}
		
		.back-btn:hover{
        background: #8CBDB9;
		}
		
		.no-data{
        text-align: center;
        color: #999;
        padding: 40px;
        font-size: 18px;
        }
	</style>
</head>
<body>
	<div class="container">
		<h1>諮詢/意見箱管理後台</h1>
		
		<div style="margin-bottom: 20px;">
			<button class="back-btn" onclick="location.href='index.html'">返回首頁</button>
			<button class="clear-btn" onclick="clearAllFeedbacks()">清空所有問題與意見</button>
		</div>
		
		<div class="stats">
			<p style="margin: 0; font-size: 16px;">總問題與意見數</p>
			<h2 id="totalCount">0</h2>
		</div>
		
		<div id="feedbackList"></div>
	</div>
	
	<script>
		function loadFeedbacks(){
			const feedbacks=JSON.parse(localStorage.getItem("feedbacks")) || [];
			const listDiv=document.getElementById("feedbackList");
			const countDiv=document.getElementById("totalCount");
			
			countDiv.textContent=feedbacks.length;
			
			if (feedbacks.length===0){
				listDiv.innerHTML='<div class="no-data">目前沒有任何意見</div>';
				return;
			}
			
			//反轉陣列 最新的在最上面
			feedbacks.reverse();
			
			listDiv.innerHTML=feedbacks.map((item, index)=>`
				<div class="feedback-item">
					<div class="feedback-header">
						意見 #${feedbacks.length-index}-${item.timestamp}
					</div>
					<div class="feedback-info">
						<div><strong>姓名：</strong>${item.name}</div>
						<div><strong>電話：</strong>${item.phone}</div>
                        <div><strong>聯絡時間：</strong>${item.time}</div>
						<div><strong>Email：</strong>${item.email}</div>
					</div>
					<div class="feedback-content">
						<strong>意見內容：</strong><br>
						${item.content}
					</div>
				</div>
			`).join("");
		}
		
		function clearAllFeedbacks() {
			if (confirm("確定要清空所有意見嗎？此操作無法復原！")) {
				localStorage.removeItem("feedbacks");
				loadFeedbacks();
				alert("已清空所有意見");
			}
		}
		
		//頁面載入時顯示意見
		loadFeedbacks();
		
		//每3秒自動更新一次
		setInterval(loadFeedbacks, 3000);
	</script>

</body>

</html>
