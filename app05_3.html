<html>
	<head>
		<title>113年15-29歲青年勞工就業狀況調查</title>
		<!--ajax引入-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
		<style>
			body {
			background-color: #8CBDB9;
			color: white;
			font-family: Arial, "Microsoft JhengHei", sans-serif;
			margin: 0;
			padding: 20px;
			}
			
			h1 {
            text-align: center;
            margin-bottom: 20px;
			}
			
			table {
            width: 100%;
            border-collapse: collapse;
            min-width: 2400px; /* 設定最小寬度,確保會出現橫向捲軸 */
			table-layout: fixed; /* 這是關鍵!沒有這個寬度設定不會生效 */
			}
			
			thead {
            position: sticky;
            top: 0;
            z-index: 10;
			}
			
			thead td {
            background-color: #2D3E4E !important;
            color: white;
            font-weight: bold;
			font-size: 18px;
            padding: 18px 8px;
            text-align: center;
            border: 1px solid #1a252f;
			}
			
			tbody td {
            padding: 18px 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            vertical-align: top;
            word-wrap: break-word; /* 確保長文字會自動斷行 */
            background-color: white;
            color: #333;
			}
			
			/* 單數行 */
			tbody tr:nth-child(odd) td {
			background-color: #E3F2FD;
			}
			
			/* 雙數行 */
			tbody tr:nth-child(even) td {
			background-color: white;
			}
			
			td {
			padding: 10px 8px;
			border: 1px solid #ddd;
			font-size: 13px;
			vertical-align: top;
			word-wrap: break-word; /* 文字自動換行 */
			}
			
			/* 針對不同欄位設定寬度 */
			thead td:nth-child(1) { width: 50px; }   /* 編號 */
			thead td:nth-child(2) { width: 100px; }  /* 統計項目別 */
			thead td:nth-child(3) { width: 120px; }  /* 細項 */
			thead td:nth-child(4) { width: 80px; }   /* 樣本數 */
			
			/* 百分比欄位 - 統一寬度 */
			thead td:nth-child(5),   /* 沒打算換工作 */
			thead td:nth-child(6)    /* 有打算換工作 */
			{
			width: 90px;
			}
			
			/* 原因欄位 - 統一較小寬度 */
			thead td:nth-child(n+7) {
			width: 85px;
			}

			/* 表格容器 - 可橫向捲動 */
			.table_container {
            overflow-x: auto;  /* 橫向捲軸 */
            overflow-y: auto;  /* 縱向捲軸 */
            max-height: 90vh;  /* 最大高度為視窗的 90% */
            margin: 20px auto;
            max-width: 95%;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			}
			
			.back-btn {
            background-color:#2D3E4E;
            color:white;
            border:none;
            padding:8px 16px;
            font-size:16px;
            border-radius:6px;
            cursor:pointer;
			}
			
			.back-btn:hover {
			background-color: #8CA9D3;
			box-shadow: 0 0 10px rgba(0,0,0,0.3);
			}
			
		</style>
	</head>

<body>
<div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:20px;">
	<h1 style="margin:0;">113年青年換工作情形：</h1>
    <button class="back-btn" onclick="goHome()">
        返回首頁
    </button>
</div>

<div class="table_container" id="tableContainer" style="display:none;">
	<table border="1">
		<thead>
		
		<tr bgcolor="#2D3E4E">
			<td align="center">編號</td>
			<td align="center">統計項目別</td>
			<td align="center">細項</td>
			<td align="center">樣本數<br>（數量）</td>
			<td align="center">沒打算換工作<br>（百分比）</td>
			<td align="center">有打算換工作<br>（百分比）</td>
			<td align="center">薪資福利不符期望<br>（百分比）</td>
			<td align="center">工作無發展前景<br>（百分比）</td>
			<td align="center">興趣不合<br>（百分比）</td>
			<td align="center">工作環境不佳<br>（百分比）</td>
			<td align="center">想換工作地點<br>（百分比）</td>
			<td align="center">個人技能無法發揮<br>（百分比）</td>
			<td align="center">公司經營困難<br>（百分比）</td>
			<td align="center">家庭或健康因素<br>（百分比）</td>
			<td align="center">工作太累壓力大<br>（百分比）</td>
			<td align="center">與同事或主管相處困難<br>（百分比）</td>
			<td align="center">想開創事業<br>（百分比）</td>
			<td align="center">擔心被解僱<br>（百分比）</td>
			<td align="center">準備考試<br>（百分比）</td>
			<td align="center">其他<br>（百分比）</td>
		</tr>
		
		</thead>
		<!--寫死tbody架構 在JQ那邊寫好資料塞進來-->
		<tbody id="row"></tbody>
		
	</table>
</div>

</body>

</html>

<script>
function goHome() {
    window.location.href = "index.html"; 
}
//jquery=JQ使用方法 $(document).ready(function(){}) JQ是他人寫好的JS套件
$(document).ready(function(){
	//ajax屬於JQ的一部分
	$.ajax({
		url:"https://apiservice.mol.gov.tw/OdService/download/A17000000J-020075-2kc", //放網址
		type:"get", //這裡用get請求 亦可用post
		dataType:"json", //檔案類型
		success:function(trans){
			//放入原本已有的資料
			total_len=trans.length;
			console.log(total_len);
			console.log(trans[0]);
			//顯示表格
			$("#tableContainer").show();

			for(i=0;i<total_len;i++){
				$("#row").append( //.html後面的都會被取代 要用增加的.append
					"<tr>"+
						"<td align='center'>"+(i+1)+"</td>"+
						"<td align='center'>"+trans[i]["統計項目別"]+"</td>"+
						"<td>"+trans[i]["細項"]+"</td>"+
						"<td align='right'>"+trans[i]["樣本數（數量）"]+"</td>"+
						"<td align='center'>"+trans[i]["沒有打算轉換工作（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["有打算轉換工作（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為薪資及福利不符期望（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為工作無發展前景（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為興趣不合（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為工作環境不佳（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為想更換工作地點（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為個人技能無法有效發揮（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為公司經營困難（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為家庭或健康因素（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為工作太累壓力大（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為與同事或主管相處困難（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為想自行開創事業（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為擔心被解僱（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為準備考試（百分比）"]+"</td>"+
						"<td align='center'>"+trans[i]["因為其他（百分比）"]+"</td>"+
					"</tr>"
				);
			} //請求成功要執行的事情
		},
		
		error:function(e){
			console.log("請求失敗!"+e);
		} //請求失敗要執行的事情 最後一個屬性不加逗號
	});
});

</script>
